<div class="dl dl-grid-bg catalog">
    <ya-kit-intersection-controller as="seen" trigger-once="1">
        <div class="catalog__inner" ref={{seen.elementRef}}>
            <ya-kit-transition is-visible={{seen.isIntersecting}} transition="custom" duration="800" easing="ease-out">
                <h2 class="dl-h1 catalog__title">{{settings.titleText}}</h2>
            </ya-kit-transition>
            <div class="catalog__stage">
                <span class="dl-word catalog__word">@@word:dopavto@@</span>
                <div class="dl-container catalog__carousel">
                    <ya-kit-carousel count="{{add (add (add (add (add (add (add (if settings.category1Title 1 0) (if settings.category2Title 1 0)) (if settings.category3Title 1 0)) (if settings.category4Title 1 0)) (if settings.category5Title 1 0)) (if settings.category6Title 1 0)) (if settings.category7Title 1 0)) (if settings.category8Title 1 0)}}" columns="3" columns-touch="2" h-gap="300" controls-alignment="edges" controls-size="md">
@@repeat 8@@
                        {{#if settings.category@@i@@Title}}
                            <ya-kit-link to={{settings.category@@i@@Url.link}} class="catalog__link">
                                <span class="catalog__image">
                                    {{#if settings.category@@i@@Image.filePath}}
                                        <ya-kit-image src={{settings.category@@i@@Image}} fit="contain" aspect-ratio="1:1" enable-paranja="{{false}}" />
                                    {{/if}}
                                </span>
                                <span class="catalog__name">{{settings.category@@i@@Title}}</span>
                            </ya-kit-link>
                        {{/if}}
@@end@@
                    </ya-kit-carousel>
                </div>
            </div>
        </div>
    </ya-kit-intersection-controller>
</div>
