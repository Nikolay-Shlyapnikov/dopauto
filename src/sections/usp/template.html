<div class="dl dl-grid-bg usp">
    <ya-kit-intersection-controller as="seen" trigger-once="1">
        <div class="dl-container" ref={{seen.elementRef}}>
            <ya-kit-transition is-visible={{seen.isIntersecting}} transition="custom" duration="800" stagger="150" easing="ease-out">
@@repeat 3@@
                <div class="usp__card">
                    {{#if settings.card@@i@@Image.filePath}}
                        <ya-kit-image class="usp__image {{if settings.card@@i@@ImageMobile.filePath 'usp__image--desktop'}}" src={{settings.card@@i@@Image}} fit="cover" enable-paranja="{{false}}" />
                    {{/if}}
                    {{#if settings.card@@i@@ImageMobile.filePath}}
                        <ya-kit-image class="usp__image usp__image--mobile" src={{settings.card@@i@@ImageMobile}} fit="cover" enable-paranja="{{false}}" />
                    {{/if}}
                    <p class="usp__text">
                        {{#if settings.card@@i@@Prefix}}<span class="usp__prefix">{{settings.card@@i@@Prefix}} </span>{{/if}}<span class="usp__value">{{settings.card@@i@@Value}}</span>
                        <span class="usp__caption">{{settings.card@@i@@Caption}}</span>
                    </p>
                </div>
@@end@@
            </ya-kit-transition>
        </div>
    </ya-kit-intersection-controller>
</div>
