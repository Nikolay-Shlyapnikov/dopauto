<div class="dl faq">
    <div class="dl-container faq__inner">
        <h2 class="dl-banner-title faq__title">{{settings.titleText}}</h2>
        <div class="faq__list">
            @@repeat 10@@
            {{#if settings.faq@@i@@Question}}
                    <ya-kit-accordion class="faq__item" default-expanded="{{eql @@i@@ 1}}">
                        <ya-kit-accordion-header>
                            <span class="faq__question">{{settings.faq@@i@@Question}}</span>
                        </ya-kit-accordion-header>
                        <ya-kit-accordion-body>
                            <p class="faq__answer">{{settings.faq@@i@@Answer}}</p>
                        </ya-kit-accordion-body>
                    </ya-kit-accordion>
            {{/if}}
@@end@@
        </div>
    </div>
</div>
