<div class="dl dl-grid-bg hits">
    <ya-kit-intersection-controller as="seen" trigger-once="1">
        <div ref={{seen.elementRef}}>
            <ya-kit-transition is-visible={{seen.isIntersecting}} transition="custom" duration="800" easing="ease-out">
                <h2 class="dl-h1 hits__title">{{settings.titleText}}</h2>
            </ya-kit-transition>
        </div>
    </ya-kit-intersection-controller>
    <div class="dl-container hits__shelf">
        <ya-kit-featured-products-controller data-source={{settings.source}} as="products" count="{{settings.count}}">
            <ya-kit-carousel count="{{length products.model}}" columns="4" columns-touch="2" h-gap="200" controls-alignment="edges" controls-size="md">
                {{#each products.model as |item|}}
                    <ya-kit-product-snippet-controller as="cart" product={{item}}>
                        <div class="hits__card">
                            <ya-kit-product-snippet product={{item}} quantity={{cart.quantity}} on-update-quantity={{cart.onUpdateQuantity}} on-toggle-favourite={{cart.onToggleFavourite}} enable-badges="{{true}}" />
                            <div class="hits__control">
                                {{#if (gt cart.quantity 0)}}
                                    <ya-kit-input-stepper value={{cart.quantity}} on-change={{cart.onUpdateQuantity}} />
                                {{else}}
                                    {{#if (eql item.totalQuantity 0)}}
                                        <ya-kit-button color="secondary" is-disabled="1">Нет в наличии</ya-kit-button>
                                    {{else}}
                                        <ya-kit-button color="primary" on-click={{cart.onAddToCart}}>В корзину</ya-kit-button>
                                    {{/if}}
                                {{/if}}
                            </div>
                        </div>
                    </ya-kit-product-snippet-controller>
                {{/each}}
            </ya-kit-carousel>
        </ya-kit-featured-products-controller>
    </div>
    <ya-kit-intersection-controller as="wordSeen" trigger-once="1">
        <div class="hits__word-box" ref={{wordSeen.elementRef}}>
            <ya-kit-transition is-visible={{wordSeen.isIntersecting}} transition="custom" duration="1200" easing="ease-out">
                <div class="hits__word">
                    <span class="dl-word dl-word--desktop">@@word:kachestvo@@</span>
                    <span class="dl-word dl-word--mobile">@@word:kachestvo-mobile@@</span>
                </div>
            </ya-kit-transition>
        </div>
    </ya-kit-intersection-controller>
</div>
