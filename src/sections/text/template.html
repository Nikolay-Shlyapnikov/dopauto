<div class="dl dl-grid-bg text">
    <ya-kit-intersection-controller as="seen" trigger-once="1">
        <div class="text__inner" ref={{seen.elementRef}}>
            <ya-kit-transition is-visible={{seen.isIntersecting}} transition="custom" duration="800" stagger="150" easing="ease-out">
                <h2 class="dl-h1 text__heading text__heading--mobile dl-reveal">
                    <span class="text__line text__line--1">{{settings.line1}}</span>
                    <span class="text__line text__line--2">{{settings.line2}}</span>
                </h2>
                <div class="text__paragraphs dl-reveal">
@@repeat 2@@
                    {{#if settings.paragraph@@i@@Text}}
                        <div class="text__paragraph">
                            {{#if settings.paragraph@@i@@Number}}<span class="text__num">{{settings.paragraph@@i@@Number}}/</span>{{/if}}
                            <p class="dl-text">{{settings.paragraph@@i@@Text}}</p>
                        </div>
                    {{/if}}
@@end@@
                </div>
                <h2 class="dl-h1 text__heading text__heading--desktop dl-reveal">
                    <span class="text__line text__line--1">{{settings.line1}}</span>
                    <span class="text__line text__line--2">{{settings.line2}}</span>
                </h2>
            </ya-kit-transition>
        </div>
    </ya-kit-intersection-controller>
</div>
